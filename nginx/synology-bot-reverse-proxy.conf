# ==============================================================================
# synology-bot-reverse-proxy.conf
# Enables standard HTTPS (port 443) access for Grokbot, AI agents & Webhooks
# Place in: /etc/nginx/conf.d/ or configure via DSM Login Portal -> Reverse Proxy
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emergencyexit.vmu.cash;

    # SSL Certificates (managed by DSM or acme.sh)
    ssl_certificate /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow bots, webhooks, and REST clients
    client_max_body_size 128M;

    # CORS Headers for AI Agent & Bot tool execution
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

    location / {
        # Proxy to internal DSM management port (5001) or containerized bot service
        proxy_pass https://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (for streaming responses & interactive sessions)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
